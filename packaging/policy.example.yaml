# سياسة الجهاز — نموذج لمسؤول تقنية المعلومات
#
# انسخ هذا الملفّ باسم policy.yaml إلى مكانٍ لا يملك المستخدم العادي
# الكتابة فيه:
#
#     ويندوز:  C:\ProgramData\VideoToArabicWord\policy.yaml
#     لينكس/ماك: /etc/videotoarabicword/policy.yaml
#
# انشره بالأداة نفسها التي تنشر البرنامج (GPO أو Intune أو نسخٌ يدوي).
# كل حقل اختياري: الحقل المحذوف يعني «لا رأي» ويبقى اختيار المستخدم.
# وكل حقل موجود يُقفل في الواجهة **ظاهرًا معطَّلًا مع سببه** لا مخفيًّا.
#
# للتحقّق بعد النشر:   python tools/doctor.py

# يمنع كل مزوّد يُخرج نصّ التفريغ من الجهاز (Claude API وغيره)، ويُسقط
# الاختيار إلى النموذج المحلي، ويمسح أي مفتاح محفوظ.
#
# ⚠ لا يوجد ضدّ لهذا الحقل: كتابة ``true`` لا تُفعّل الإرسال، تكتفي
#    بعدم المنع. سياسةٌ تستطيع **تشغيل** إرسال البيانات تصير طريق
#    هجوم — ملفٌّ يُدَسّ في مجلد مشترك يحوّل أداةً محلّية إلى قناة تسريب.
allow_cloud_ai: false

# يُلزم كتابة سجلّ تدقيق لكل مهمّة ويمنع تعطيله من الواجهة.
# السجلّ JSONL إلحاقي فيه: من ومتى وأي ملف وكم استغرق وما المخرجات،
# وأهمّ حقل فيه ``text_left_device``. ولا يحوي نصّ المحاضرة إطلاقًا.
require_audit_log: true

# يفرض مجلد الحفظ — مجلد شبكة مؤرشَف مثلًا.
# force_output_dir: '\\\\srv-files\\محاضرات\\مخرجات'

# يثبّت صيغ الإخراج فلا يبدّلها المستخدم.
# المتاح: html · pdf · pptx · chapters · study · flashcards · scorm
lock_export_formats: [html, chapters, scorm]

# يمنع تنزيل نموذج التفريغ من الأجهزة (تُنشر النماذج مركزيًّا).
# allow_model_download: false

# يمنع تسجيل الشاشة من البرنامج (زر «تسجيل الشاشة»). التسجيل المحلي
# صامت ولا يظهر للمشاركين، فقد تحتاج جهتك إلى منعه أو ضبطه بسياسة.
# allow_meeting_recording: false

# يمنع تنزيل أداة التسجيل (OBS Studio) من الإنترنت. تبقى النسخة التي تنشرها
# الإدارة مركزيًّا صالحة إن حُدِّد مسارها في إعداد recording.obs_path.
# allow_obs_download: false

# يمنع «سجّلني — دليل خطوة بخطوة» (تسجيل كل نقرة على الشاشة إلى دليل مصوّر).
# الصور تُظهر كل ما على الشاشة من إشعارات وبريد مفتوح؛ ما يُكتب لا يُسجَّل أبدًا.
# allow_screen_guide: false

# يمنع إرسال إحصاءات الاستخدام المجمّعة (أعداد فقط) إلى مسؤول الترخيص.
# allow_usage_stats: false

# يظهر للمستخدم بجوار كل حقل مقفل. اكتب فيه من فرض السياسة وكيف يُراجَع —
# المستخدم الذي يعرف الجهة لا يفتح بلاغًا على البرنامج.
notice: 'مفروض بسياسة إدارة تقنية المعلومات — راجع مكتب الخدمة للاستثناءات'
