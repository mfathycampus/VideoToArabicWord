name: CI

# البوابة الحقيقية هي tools/run_acceptance.py: يشغّل الاختبارات، ثم
# مصفوفة التوافق على 30 ملف فيديو مولَّدًا، ثم بوابات جودة المستند،
# ويعيد رمز خروج غير صفري إذا نزلت نسبة الاجتياز تحت 97%.
# كان مصمَّمًا لهذا الغرض ولم يكن هناك ما يشغّله.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: اختبارات · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: تثبيت ffmpeg ومكتبات Qt (Linux)
        # مكتبات Qt مطلوبة لاختبار تخطيط الواجهة: ``import PyQt6`` ينجح
        # بلا أي منها، لكن ``QtWidgets`` يحتاج libEGL/libGL فينهار جمعُ
        # الاختبارات كلها. بدونها يُتخطّى الاختبار بصمت — وهو بالضبط ما
        # يفترض أن يمسك انهيار التخطيط.
        #
        # القائمة مقصورة على ما يحتاجه منصّة ``offscreen`` فعلًا. حزم
        # ‏xcb-* ليست مطلوبة بلا خادم عرض، وإدراجها أسقط الوظيفة على
        # ‏ubuntu 24.04 (noble) بـ ``E: Unable to locate package
        # libxcb-xinerama4`` — حزمة أُزيلت من هذا الإصدار.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: تثبيت ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: فحص البيئة
        run: python tools/doctor.py

      - name: توليد مصفوفة الفيديو
        run: python tools/make_test_corpus.py

      - name: حزمة الاختبارات
        run: python -m pytest tests/ -q

      - name: بوابات القبول الكاملة
        # الأبطأ، ويكفي مرة واحدة لكل دفعة
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/run_acceptance.py

      - name: حفظ تقرير القبول
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance_report.json
          if-no-files-found: ignore

  lint:
    name: فحص الأسلوب
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
