name: تدقيق الثغرات

# 1.22.5: ملف القفل يثبّت ما يُشحن — والمثبَّت يشيخ. ثغرةٌ تُكتشف في حزمة مقفلة
# لا تظهر في أي طلب دمج، فيُفحص الملف كل أسبوع، وعند كل تعديل عليه. فشل
# التشغيل المجدول يصل صاحب المستودع بريدًا من GitHub.
#
# العلاج حين يفشل:  python tools/lock_requirements.py --upgrade  ثم طلب دمج.

on:
  schedule:
    - cron: "17 5 * * 1"          # الاثنين 08:17 بتوقيت الرياض
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.lock.txt
      - requirements-build.in

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit على ملف القفل
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock.txt --require-hashes --disable-pip --progress-spinner off
