name: بناء الحزمة التنفيذية

# PyInstaller مع PyQt6 و ctranslate2 وثنائيات ffmpeg هو أكبر مجهول في
# المشروع. تشغيله في كل دفعة يكشف أعطال التغليف يوم حدوثها لا يوم التسليم.
#
# كان يعمل على الوسوم فقط، فبقيت الحزمة بلا فحص بين إصدار وإصدار — وفي
# تلك الفجوة بالضبط دخل عطلٌ منع الحزمة من الإقلاع كليًا. البناء الآن
# على كل دفعة إلى main وعلى كل طلب دمج.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # مطلوبة لإنشاء الإصدار ورفع المثبِّت إليه. بدونها تفشل
    # الخطوة الأخيرة بـ 403 بعد بناءٍ ناجح كامل.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          # 1.22.5: من ملف القفل وحده — إصدارات مثبّتة بتجزئات (tools/lock_requirements.py).
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: تعبئة bin/ بـ ffmpeg و ffprobe
        run: python tools/setup_ffmpeg.py
      - name: تجهيز Tesseract للشحن داخل الحزمة
        # المعلّم لا يثبّت شيئًا: بلا Tesseract لا تمويه لأسماء الطلاب في
        # اللقطات ولا قصّ لشريط المتصفّح. يُنسخ ما يلزم التشغيل وحده.
        # 1.20.1: **فشله يوقف الإصدار.** كان اختياريًّا لأن الحزمة «تعمل بلا
        # OCR» — ومنذ 1.20.1 اللقطات غير المفحوصة لا تدخل المستند، فحزمةٌ بلا
        # Tesseract تُنتج مستندات بلا صور لكل مستخدميها.
        shell: pwsh
        run: |
          # 1.22.5: إصدار محدّد — ما يُشحن للمعلّمين لا يتغيّر بلا التزام في المستودع.
          choco install tesseract --version=5.5.3.20260724 -y --no-progress
          python tools/setup_tesseract.py --source "$env:ProgramFiles\Tesseract-OCR"
      - name: توليد أيقونة ويندوز
        # مُشتقّة من الشعار ومستبعَدة من المستودع. بلا هذه الخطوة يخرج
        # التطبيق بأيقونة Python الافتراضية في قائمة ابدأ.
        run: python tools/make_icon.py
      - name: البناء
        run: pyinstaller build.spec --noconfirm

      - name: تأكيد شحن Tesseract وحزمة العربية
        # build.spec يتخطّى bin/tesseract بصمت إن غاب — وحزمةٌ بلا Tesseract
        # تُنتج منذ 1.20.1 مستندات بلا صور. يُفحص الناتج نفسه لا خطوة التجهيز.
        shell: pwsh
        run: |
          $root = "dist/VideoToArabicWord/_internal/tesseract"
          foreach ($f in @("tesseract.exe", "tessdata/ara.traineddata", "tessdata/eng.traineddata")) {
            if (-not (Test-Path "$root/$f")) { throw "غير مشحون في الحزمة: $root/$f" }
          }
          # 1.21.2: وجود الملفات لا يكفي — قراءةٌ فعلية بالأمر نفسه الذي يستعمله
          # البرنامج، وبحزمة اللغات المشحونة وحدها (بلا tessdata/configs).
          python -c "from PIL import Image, ImageDraw, ImageFont; im = Image.new('RGB', (900, 200), 'white'); ImageDraw.Draw(im).text((20, 60), 'Password Login', fill='black', font=ImageFont.load_default(size=48)); im.save('ocr_probe.png')"
          $env:TESSDATA_PREFIX = (Resolve-Path "$root/tessdata").Path
          & "$root/tesseract.exe" ocr_probe.png ocr_probe -l eng --psm 3 -c tessedit_create_tsv=1 -c tessedit_create_txt=0
          if (-not (Test-Path ocr_probe.tsv)) { throw "Tesseract المشحون لم يُخرج TSV" }
          if (-not (Select-String -Path ocr_probe.tsv -Pattern "Password" -Quiet)) { throw "Tesseract المشحون لم يقرأ نصّ الاختبار" }

      - name: فحص الحزمة — تخطيط وإقلاع فعليّان
        # الفحص السابق كان ``Test-Path`` على الملف التنفيذي فقط. الوجود
        # لا يعني الإقلاع: حزمة لا تفتح إطلاقًا كانت تمرّ منه. الآن
        # ``build_smoke`` يشغّل ``--selftest`` داخل الحزمة نفسها،
        # فيفحص مساراتها المجمّدة وثنائياتها المشحونة.
        run: python tools/build_smoke.py dist/VideoToArabicWord

      - name: تأكيد أن غياب ffmpeg من PATH لا يمنع الإقلاع
        # هذا هو جهاز المعلّم بالضبط: ويندوز نظيف بلا ffmpeg مثبَّت.
        # الحزمة يجب أن تعتمد على ثنائياتها المشحونة وحدها. لولا هذه
        # الخطوة لبقي العطل الأصلي غير مرئي: عدّاء GitHub يملك ffmpeg
        # في PATH بعد خطوة setup_ffmpeg، فيمرّ الفحص على حزمة معطوبة.
        #
        # وتفريغ PATH يُخفي ffmpeg — ويُخفي **المفسّر نفسه**. سقط
        # البناء ثلاث مرّات متتالية بـ«python is not recognized» قبل
        # أن يبدأ الفحص أصلًا، فبقي المثبِّت غير مُنتَج. الحلّ: نلتقط
        # مسار المفسّر قبل التفريغ ونستدعيه بمساره المطلق.
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot;$env:SystemRoot\System32"
          # حارس: بلا هذا السطر يصير الفحص بلا معنى إن عاد ffmpeg
          # إلى PATH يومًا — يمرّ على حزمة معطوبة كما مرّ من قبل.
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            throw "ffmpeg ما زال في PATH — هذه الخطوة لا تفحص شيئًا"
          }
          & $python tools/build_smoke.py dist/VideoToArabicWord

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # ‏1.12.0: «Artifact storage quota has been hit» أسقط الوظيفة هنا
        # فلم يُبنَ المثبِّت ولم يُنشر الإصدار. الحزمة المفكوكة نسخةُ فحصٍ
        # لا مُخرَج: فشل رفعها لا يوقف النشر، وتُحذف بعد 3 أيام.
        continue-on-error: true
        with:
          name: VideoToArabicWord-windows
          path: dist/VideoToArabicWord
          retention-days: 3

      # ── المثبِّت: على الوسوم فقط ───────────────────────────────────
      # بناؤه في كل دفعة يضيف دقائق بلا فائدة؛ ما يُسلَّم للمعلّمين هو
      # الإصدار الموسوم.
      - name: تطابق الوسم مع version.py
        # وسمٌ لا يطابق ``version.py`` يُنتج مثبِّتًا اسمه 1.5.0 لبرنامجٍ
        # يعرض 1.4.0 في ترويسته — وهو ما حدث فعلًا في أوّل إصدار موسوم،
        # ولاحظه المستخدم لا أنا. رقمان لشيء واحد يفترقان بصمت، وهذا
        # الحارس يُسقط البناء بدل أن يُسلّم التناقض.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $app = (python -c "import version; print(version.APP_VERSION)").Trim()
          if ($tag -ne $app) {
            throw "الوسم v$tag لا يطابق version.py ($app). حدّث version.py ثم أعد الوسم."
          }
          Write-Host "الوسم و version.py متطابقان: $app"

      - name: بناء المثبِّت
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version packaging\installer.iss
        shell: pwsh

      # 1.22.3: المثبِّت غير موقَّع، فبصمته المنشورة هي ما يتحقّق به المعلّم
      # أن الملف الذي نزّله هو نفسه الذي بُني هنا.
      - name: بصمة SHA-256 للمثبِّت
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\*-setup.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          $lines | Write-Host

      - name: رفع المثبِّت
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # المثبِّت يُرفق بالإصدار نفسه في الخطوة التالية؛ هذه نسخة إضافية
        continue-on-error: true
        with:
          name: VideoToArabicWord-installer
          path: dist/*-setup.exe
          retention-days: 7

      # ── النشر: المثبِّت إلى صفحة الإصدارات ─────────────────────────
      # مخرَج Actions ليس تسليمًا. تنزيله يحتاج حساب GitHub وتسجيل
      # دخول، ويصل أرشيف zip لا مثبِّتًا، وتنتهي صلاحيته بعد 90 يومًا.
      # فكان كل إصدارٍ يُبنى ولا يصل أحدًا: من يملك 1.4.0 لا رابط له
      # يعرفه ولا وسيلة ليعلم أن 1.5.0 صدرت أصلًا.
      #
      # هنا يصير للإصدار عنوانٌ ثابت — ‏``/releases/latest`` — يُرسَل
      # للمعلّم كما هو، ويقرؤه فحص التحديث داخل البرنامج
      # (‏``utils/updater.py``).
      - name: نشر الإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          name: ${{ github.ref_name }}
          # ``make_latest`` هو ما يجعل ``/releases/latest`` يشير إليه.
          make_latest: true
          generate_release_notes: true
          body: |
            ## التنزيل

            نزّل `VideoToArabicWord-*-setup.exe` من الأسفل وشغّله.
            لا يحتاج صلاحيات مدير.

            > ويندوز سيعرض تحذير SmartScreen لأن المثبِّت غير موقَّع
            > رقميًّا بعد. اختر **مزيد من المعلومات ← تشغيل على أي حال**.

            **للتحقّق من الملف قبل تشغيله:** بصمته في `SHA256SUMS.txt` أدناه.
            في PowerShell: `Get-FileHash .\VideoToArabicWord-*-setup.exe` — يجب أن
            تطابق البصمة الظاهرة البصمة في الملف.

            تفاصيل ما تغيّر في
            [`CHANGELOG.md`](https://github.com/mfathycampus/VideoToArabicWord/blob/main/CHANGELOG.md).

  # ── macOS (Apple Silicon) — غير موقَّع بعد ───────────────────────────
  # يعمل على الدفعات وطلبات الدمج فقط؛ لا يلمس الإصدار ولا الوسوم.
  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # macos-14 لم يعد متاحًا («The configuration 'macos-14-arm64-us-default' is
    # not supported») فأُلغيت الوظيفة قبل أي خطوة. macos-15 مثله Apple Silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          # 1.22.5: من ملف القفل وحده — إصدارات مثبّتة بتجزئات (tools/lock_requirements.py).
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: تعبئة bin/ بـ ffmpeg و ffprobe (بناءان ساكنان)
        run: python tools/setup_ffmpeg.py
      - name: توليد أيقونة ماك
        run: python tools/make_icon.py --icns
      - name: البناء
        run: pyinstaller build.spec --noconfirm
      - name: فحص الحزمة — تخطيط وإقلاع فعليّان
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/build_smoke.py dist/VideoToArabicWord
      - name: تحزيم dmg
        run: |
          test -d dist/VideoToArabicWord.app
          hdiutil create -volname VideoToArabicWord \
            -srcfolder dist/VideoToArabicWord.app -ov -format UDZO \
            dist/VideoToArabicWord-macos-arm64.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: VideoToArabicWord-macos
          path: dist/VideoToArabicWord-macos-arm64.dmg
          retention-days: 3
