<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="محوّل المحاضرات">
  <title>محوّل المحاضرات</title>
  <!-- حلقة الواو، وفيها مثلّث التشغيل.
       نصف القطر هنا 17.5 لا 22: حدّ SVG يُرسم على منتصف المسار
       (‏17.5 + 9/2 = 22)، بينما Pillow ترسمه إلى الداخل من 22.
       الحافة الخارجية واحدة في الاثنين — وهذا هو المقصود. -->
  <circle cx="34" cy="36" r="17.5" fill="none" stroke="#0B2E2A" stroke-width="9"/>
  <path d="M34 58 L34 70 Q34 78 44 78 L88 78" fill="none" stroke="#0B2E2A" stroke-width="9" stroke-linecap="round"/>
  <path d="M29 28 L45 36 L29 44 Z" fill="#0F766E"/>
  <!-- أسطر النصّ التي يخرج إليها الذيل -->
  <rect x="66" y="22" width="22" height="7" rx="3.5" fill="#0B2E2A" opacity="0.30"/>
  <rect x="66" y="36" width="22" height="7" rx="3.5" fill="#0B2E2A" opacity="0.20"/>
  <rect x="66" y="50" width="14" height="7" rx="3.5" fill="#0B2E2A" opacity="0.13"/>
</svg>
